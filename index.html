<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hitster Català</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 2rem;
      letter-spacing: 2px;
    }
    .btn-play {
      background-color: #1db954;
      border: none;
      color: white;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      font-size: 3.5rem;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(29, 185, 84, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-play:active {
      transform: scale(0.92);
    }
    .status {
      margin-top: 1.5rem;
      font-size: 0.98rem;
      opacity: 0.7;
    }
    #player { display: none; }
  </style>
</head>
<body>

  <div class="title">🎵 HITSTER CATALÀ</div>
  <button class="btn-play" id="playBtn" onclick="togglePlay()">▶</button>
  <div class="status" id="statusText">Prem Play per reproduir</div>

  <div id="player"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let isPlaying = false;

    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v');

    function onYouTubeIframeAPIReady() {
      if (!videoId) {
        document.getElementById('statusText').innerText = 'No s\'ha trobat cap cançó';
        return;
      }
      player = new YT.Player('player', {
        height: '0',
        width: '0',
        videoId: videoId,
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function togglePlay() {
      if (!player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function onPlayerStateChange(event) {
      const btn = document.getElementById('playBtn');
      const status = document.getElementById('statusText');
      
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        btn.innerText = '⏸';
        status.innerText = 'Sonant...';
      } else if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        btn.innerText = '▶';
        status.innerText = 'Pausat';
      } else if (event.data === YT.PlayerState.ENDED) {
        isPlaying = false;
        btn.innerText = '▶';
        status.innerText = 'Cançó acabada';
      }
    }
  </script>
</body>
</html>
